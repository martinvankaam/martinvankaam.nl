<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marbas Groep</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#14181f; --ink2:#5a6372; --ink3:#8a93a3; --line:#e4e7ec;
  --accent:#1f5eff; --accent-soft:#e8efff; --pos:#127a4b; --neg:#b42318; --grey:#b9c0cc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--ink:#eef1f6;--ink2:#a5aebd;--ink3:#7b8494;--line:#262c36;--accent:#6e95ff;--accent-soft:#1c2740;--pos:#4cc38a;--neg:#f2837a;--grey:#4a5566;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--ink:#eef1f6;--ink2:#a5aebd;--ink3:#7b8494;--line:#262c36;--accent:#6e95ff;--accent-soft:#1c2740;--pos:#4cc38a;--neg:#f2837a;--grey:#4a5566;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:13px}
.periods{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:6px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px;min-height:38px}
.selbar h2{margin:0;font-size:19px}
.back{font:inherit;font-size:14px;font-weight:600;color:var(--bg);background:var(--accent);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.back:hover{filter:brightness(1.1)}
.back.off{visibility:hidden}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .v{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--ink3);font-size:12px;margin-top:2px;height:18px;overflow:hidden;white-space:nowrap}
.kpi.ghost{visibility:hidden}
.kpi.main{background:var(--accent-soft);border-color:transparent}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.charts h3{margin:0 0 6px;font-size:13px;color:var(--ink2);font-weight:600}
.chartbox{position:relative}
.chartbox{height:230px}
.chartbox svg{display:block;max-width:100%}
.chartbox .empty{height:100%;display:flex;align-items:center;justify-content:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;display:none;z-index:5}
.legend{display:flex;gap:14px;color:var(--ink2);font-size:12px;margin-top:6px;height:18px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tabs{display:flex;gap:6px;margin:34px 0 14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.unit{margin-bottom:12px}
.unit-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.unit-h h3{margin:0;font-size:17px}
.unit-h .tot{font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--ink3);font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td,tr.sel td{background:var(--accent-soft)}
td.name{font-weight:550}
td .sm{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.empty{color:var(--ink3);padding:6px 0;font-size:14px}
.scroll{overflow-x:auto}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.kpi .v{font-size:21px}}

/* ---- app (inloggen, navigatie, uren, personeel) ---- */
body{min-height:100vh}
.navbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.navbar .brand{font-weight:700;font-size:17px;margin-right:6px}
.navbar .navs{display:flex;gap:6px;flex-wrap:wrap}
.navbar .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.navbtn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn2{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.btn2.danger{color:var(--neg)}
.btn2:hover{background:var(--accent-soft)}
input,select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink3)}
.row-f{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 180px}
h2.sec{font-size:17px;margin:0 0 12px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weekbar b{font-size:16px}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:4px}
.day-h b{color:var(--ink)}
.entry{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;flex-wrap:wrap}
.entry .e-s{flex:1 1 200px}
.entry .e-n{color:var(--ink3);font-size:12px;display:block}
.entry .e-h{font-variant-numeric:tabular-nums;font-weight:600;min-width:48px;text-align:right}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2);margin-left:6px}
.msg{font-size:13px;min-height:18px}
.msg.err{color:var(--neg)}.msg.ok{color:var(--pos)}
.splitbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px}
.splitbox .sp{display:flex;align-items:center;gap:8px;font-size:13px}
.splitbox input[type=number]{width:72px;padding:6px 8px}
.splitbox .sum{grid-column:1/-1;font-size:12px;color:var(--ink3)}
.simple td,.simple th{padding:8px 8px}
.simple td.l,.simple th.l{text-align:left}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink2)}
.pill.off{background:transparent;border:1px solid var(--line);color:var(--ink3)}
.center{max-width:380px;margin:12vh auto 0}
@media(max-width:760px){.navbar .who{margin-left:0;width:100%}}
</style>
</head>
<body>

<div class="wrap center" id="v-login" hidden>
  <h1 style="margin-bottom:6px">Marbas Groep</h1>
  <div class="sub" style="margin-bottom:18px">Inloggen</div>
  <form id="lf" class="card stack">
    <label class="f">Gebruikersnaam<input id="lu" autocomplete="username" autocapitalize="off" required></label>
    <label class="f">Wachtwoord<input id="lp" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="lb">Inloggen</button>
    <div id="le" class="msg err"></div>
  </form>
</div>

<div class="wrap center" id="v-chg" hidden>
  <h1 style="margin-bottom:6px">Kies je eigen wachtwoord</h1>
  <div class="sub" style="margin-bottom:18px">Minimaal 10 tekens. Dit wachtwoord ken alleen jij.</div>
  <form id="cf" class="card stack">
    <label class="f">Nieuw wachtwoord<input id="c1p" type="password" autocomplete="new-password" required></label>
    <label class="f">Nieuw wachtwoord nog een keer<input id="c2p" type="password" autocomplete="new-password" required></label>
    <button class="btn" type="submit" id="cb">Opslaan</button>
    <div id="ce" class="msg err"></div>
  </form>
</div>

<div class="wrap" id="v-app" hidden>
  <div class="navbar">
    <span class="brand">Marbas Groep</span>
    <div class="navs" id="navs"></div>
    <div class="who"><span id="whoname"></span><button class="btn2" id="logout">Uitloggen</button></div>
  </div>

  <section id="tab-fin" hidden>
  <div class="periods" id="periods" role="group" aria-label="Periode"></div>

  <div class="selbar"><h2 id="seltitle"></h2><button class="back off" id="back">← Terug naar totaal</button></div>
  <div class="kpis" id="kpis"></div>
  <div class="charts" id="charts">
    <div class="card" id="c1"><h3>Opbrengsten en kosten</h3><div class="chartbox" id="ch1"></div><div class="legend"><span><i style="background:var(--accent)"></i>Opbrengsten</span><span><i style="background:var(--grey)"></i>Kosten</span></div></div>
    <div class="card" id="c2"><h3>Resultaat</h3><div class="chartbox" id="ch2"></div><div class="legend"></div></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="bu" aria-selected="true">Per business unit</button>
    <button class="tab" role="tab" data-t="bv" aria-selected="false">Per BV</button>
  </div>
  <div id="view"></div>

  </section>

  <section id="tab-uren" hidden></section>
  <section id="tab-pers" hidden></section>
  <div class="tip" id="tip"></div>
</div>

<script>
const API='https://marbas-dashboard.ancient-snowflake-c853.workers.dev';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const nl=n=>String(Math.round(n*100)/100).replace('.',',');
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},del:k=>{try{sessionStorage.removeItem(k)}catch{}}};
let ME=null,BVS=[],SUBJECTS=[],USERS=[];

async function api(path,opt={}){
  const h={...(opt.headers||{})};const t=ss.get('mt');if(t)h.Authorization='Bearer '+t;
  if(opt.body&&!h['Content-Type'])h['Content-Type']='application/json';
  let r;try{r=await fetch(API+path,{...opt,headers:h,body:opt.body&&typeof opt.body!=='string'?JSON.stringify(opt.body):opt.body})}catch{return {ok:false,status:0,j:{error:'Geen verbinding.'}}}
  const raw=r.headers.get('content-type')||'';let j=raw.includes('json')?await r.json().catch(()=>({})):await r.text();
  if(r.status===401&&path!=='/login'){ss.del('mt');view('login')}
  return {ok:r.ok,status:r.status,j};
}
function view(v){['login','chg','app'].forEach(x=>$('v-'+x).hidden=x!==v)}

// ---------- inloggen ----------
$('lf').onsubmit=async e=>{
  e.preventDefault();const b=$('lb'),er=$('le');b.disabled=true;er.textContent='';
  const r=await api('/login',{method:'POST',body:{username:$('lu').value,password:$('lp').value}});
  b.disabled=false;$('lp').value='';
  if(!r.ok){er.textContent=r.j.error||'Inloggen lukt niet.';return}
  ss.set('mt',r.j.token);
  if(r.j.mustChange)view('chg');else startApp();
};
$('cf').onsubmit=async e=>{
  e.preventDefault();const er=$('ce');er.textContent='';
  if($('c1p').value!==$('c2p').value){er.textContent='De twee wachtwoorden zijn niet gelijk.';return}
  const r=await api('/password',{method:'POST',body:{password:$('c1p').value}});
  if(!r.ok){er.textContent=r.j.error||'Opslaan lukt niet.';return}
  $('c1p').value=$('c2p').value='';startApp();
};
$('logout').onclick=()=>{ss.del('mt');ME=null;location.reload()};

// ---------- app ----------
const TABS=[];let curTab=null;
async function startApp(){
  const r=await api('/me');if(!r.ok){view('login');return}
  if(r.j.user.mustChange){view('chg');return}
  ME=r.j.user;BVS=r.j.bvs;$('whoname').textContent=ME.name;
  TABS.length=0;
  if(ME.role==='admin')TABS.push(['fin','Financieel']);
  TABS.push(['uren','Uren']);
  if(ME.role==='admin')TABS.push(['pers','Personeel']);
  $('navs').innerHTML=TABS.map(([k,l])=>`<button class="navbtn" data-k="${k}">${l}</button>`).join('');
  $('navs').querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>openTab(b.dataset.k));
  view('app');
  openTab(ss.get('tab')&&TABS.some(t=>t[0]===ss.get('tab'))?ss.get('tab'):TABS[0][0]);
}
async function openTab(k){
  curTab=k;ss.set('tab',k);
  ['fin','uren','pers'].forEach(x=>$('tab-'+x).hidden=x!==k);
  $('navs').querySelectorAll('.navbtn').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
  if(k==='fin')await openFin();
  if(k==='uren')await openUren();
  if(k==='pers')await openPers();
}
async function loadSubjects(){const r=await api('/subjects');if(r.ok)SUBJECTS=r.j.subjects}
async function loadUsers(){if(ME.role!=='admin')return;const r=await api('/users');if(r.ok)USERS=r.j.users}
function flash(el,msg,err){el.textContent=msg;el.className='msg '+(err?'err':'ok');if(!err)setTimeout(()=>{if(el.textContent===msg)el.textContent=''},3000)}

// ---------- financieel ----------
let finLoaded=false;
async function openFin(){
  if(finLoaded){renderTop();return}
  const r=await api('/data');
  if(!r.ok){$('tab-fin').innerHTML='<div class="card">Cijfers laden lukt niet.</div>';return}
  finLoaded=true;finBoot(r.j);
}
const eur = n => (n==null||isNaN(n))?'–':new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const cls = n => n==null?'':(n<0?'neg':'pos');
const sumN=a=>{let s=0,any=false;a.forEach(x=>{if(x!=null){s+=x;any=true}});return any?s:null};

let DATA,BY={},UNITS,BVORDER;
const mk=(y0,y1)=>{const m=[];for(let y=y0;y<=y1;y++)for(let i=1;i<=12;i++){if(y===2026&&i>11)break;m.push(y+'-'+String(i).padStart(2,'0'))}return m};
const PERIODS=[
 {id:'y2026',lab:'Dit jaar',months:mk(2026,2026),end:2026},
 {id:'y2025',lab:'2025',months:mk(2025,2025),end:2025},{id:'y2024',lab:'2024',months:mk(2024,2024),end:2024},{id:'y2023',lab:'2023',months:mk(2023,2023),end:2023},
 {id:'r2',lab:'Laatste 2 jaar',months:mk(2025,2026),end:2026},
 {id:'r3',lab:'Laatste 3 jaar',months:mk(2024,2026),end:2026},
 {id:'r5',lab:'Laatste 5 jaar',months:mk(2022,2026),end:2026},
];
const state={p:'y2026',sel:'total',tab:'bu'};
const per=()=>PERIODS.find(x=>x.id===state.p);
const MN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const mval=(it,m,f)=>it.months[m]?it.months[m][f]:null;
const agg=(it,f)=>sumN(per().months.map(m=>mval(it,m,f)));
const balAt=it=>it.bal?(it.bal[per().end]||null):null;

function renderPeriods(){
  const el=document.getElementById('periods');
  el.innerHTML=PERIODS.map((p,i)=>(i===4?'<span class="sep"></span>':'')+`<button class="chip" data-p="${p.id}" aria-pressed="${p.id===state.p}">${p.lab}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.p=b.dataset.p;render()});
}
const kpi=(l,v,n,c)=>`<div class="card kpi ${c||''}"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;

function renderTop(){
  const it=BY[state.sel],P=per();
  document.getElementById('seltitle').textContent=it.label;
  document.getElementById('back').className='back'+(state.sel==='total'?' off':'');
  const b=balAt(it),o=agg(it,'o'),k=agg(it,'k'),r=agg(it,'r');
  const plab=P.id==='y2026'?'2026 tot nu':P.lab;
  const balLab=P.end===2026?'Nu':'Eind '+P.end;
  const res=kpi('Resultaat',`<span class="${cls(r)}">${eur(r)}</span>`,plab,'main');
  document.getElementById('kpis').innerHTML=b?
    kpi('Banksaldo',eur(b.bank),balLab)+kpi('Nog te ontvangen',eur(b.ont),balLab)+kpi('Nog te betalen',eur(b.bet),balLab)+res
    :kpi('Opbrengsten',eur(o),plab)+kpi('Kosten',eur(k),plab)+res+kpi('','','','ghost');
  const ms=P.months;
  lineChart('ch1',ms,[{name:'Opbrengsten',color:'var(--accent)',v:ms.map(m=>mval(it,m,'o'))},{name:'Kosten',color:'var(--grey)',v:ms.map(m=>mval(it,m,'k'))}]);
  lineChart('ch2',ms,[{name:'Resultaat',color:'var(--accent)',v:ms.map(m=>mval(it,m,'r'))}],true);
}

// ---------- lijngrafieken per maand (1 as, eigen schaal) ----------
const tip=document.getElementById('tip');
function showTip(e,txt){const wr=tip.parentElement.getBoundingClientRect();tip.style.display='block';tip.textContent=txt;
  tip.style.left=Math.max(0,Math.min(e.clientX-wr.left+14,wr.width-260))+'px';tip.style.top=(e.clientY-wr.top-40)+'px'}
const hideTip=()=>{tip.style.display='none'};
const fmtK=v=>Math.abs(v)>=1e6?(v/1e6).toLocaleString('nl-NL',{maximumFractionDigits:1})+' mln':Math.round(v/1000).toLocaleString('nl-NL')+'k';
function lineChart(id,ms,series,zero){
  const box=document.getElementById(id),W=Math.max(280,box.clientWidth||480),H=230,pl=46,pr=12,pt=10,pb=26,n=ms.length;
  const all=series.flatMap(s=>s.v).filter(v=>v!=null);
  if(!all.length){box.innerHTML='<div class="empty">Geen cijfers in Moneybird voor deze periode</div>';return}
  let mn=Math.min(...all,0),mx=Math.max(...all,0);if(mn===mx)mx=mn+1;const pad=(mx-mn)*.08;if(mn<0)mn-=pad;if(mx>0)mx+=pad;
  const X=i=>pl+i*(W-pl-pr)/Math.max(1,n-1),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let g='';
  for(let t=0;t<4;t++){const v=mn+(mx-mn)*t/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${fmtK(v)}</text>`}
  if(mn<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink3)"/>`;
  ms.forEach((m,i)=>{const mo=+m.slice(5)-1,yr=m.slice(2,4);
    const show=n<=12?true:(n<=24?mo%3===0:(n<=36?mo%6===0:mo===0));
    if(show)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink3)">${n<=12?MN[mo]:(mo===0?'jan ’'+yr:MN[mo])}</text>`});
  series.forEach(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i)+' '+Y(v)+' ';pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
  g+=`<line id="${id}x" y1="${pt}" y2="${H-pb}" stroke="var(--ink3)" stroke-dasharray="3 3" style="display:none"/>`;
  series.forEach((s,k)=>g+=`<circle id="${id}c${k}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2" style="display:none"/>`);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
  const svg=box.querySelector('svg');
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.round((x-pl)*(n-1)/(W-pl-pr))));
    const cx=svg.querySelector('#'+id+'x');cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.style.display='';
    series.forEach((s,k)=>{const c=svg.querySelector('#'+id+'c'+k);if(s.v[i]==null){c.style.display='none'}else{c.setAttribute('cx',X(i));c.setAttribute('cy',Y(s.v[i]));c.style.display=''}});
    const m=ms[i];showTip(e,MN[+m.slice(5)-1]+' '+m.slice(0,4)+': '+series.map(s=>(series.length>1?s.name+' ':'')+eur(s.v[i])).join(' · '))};
  svg.onmouseleave=()=>{hideTip();svg.querySelectorAll('circle,#'+id+'x').forEach(c=>c.style.display='none')};
}

// ---------- tabellen ----------
const tbl=(head,rows)=>`<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
function row(it,full){
  const o=agg(it,'o'),k=agg(it,'k'),r=agg(it,'r'),b=balAt(it);
  let c=`<td>${eur(o)}</td><td>${eur(k)}</td><td class="${cls(r)}">${eur(r)}</td>`;
  if(full)c+=`<td>${b?eur(b.bank):'–'}</td><td>${b?eur(b.ont):'–'}</td><td>${b?eur(b.bet):'–'}</td>`;
  return `<tr class="row ${state.sel===it.id?'sel':''}" data-id="${it.id}"><td class="name">${it.label}${it.sub?`<span class="sm">${it.sub}</span>`:''}</td>${c}</tr>`;
}
function viewBU(){
  const head=['','Opbrengsten','Kosten','Resultaat'];
  return UNITS.map(u=>{
    const its=u.rows.map(id=>BY[id]),r=sumN(its.map(i=>agg(i,'r')));
    return `<div class="card unit"><div class="unit-h"><h3>${u.n}</h3><span class="tot ${cls(r)}">${eur(r)}</span></div>${tbl(head,its.map(i=>row(i,false)).join(''))}</div>`;
  }).join('');
}
function viewBV(){
  const head=['','Opbrengsten','Kosten','Resultaat','Banksaldo','Te ontvangen','Te betalen'];
  return `<div class="card">${tbl(head,BVORDER.map(id=>row(BY[id],true)).join(''))}</div>`;
}
function renderView(){
  const v=document.getElementById('view');
  v.innerHTML=state.tab==='bv'?viewBV():viewBU();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===state.tab));
  v.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{state.sel=tr.dataset.id;render();window.scrollTo({top:0,behavior:'smooth'})});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;renderView()});
document.getElementById('back').onclick=()=>{state.sel='total';render()};
function render(){renderPeriods();renderTop();renderView()}
function finBoot(d){DATA=d;BY={};d.items.forEach(i=>BY[i.id]=i);UNITS=d.units;BVORDER=d.bvorder;render()}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(DATA&&curTab==='fin')renderTop()},150)});


// ---------- uren ----------
const U={week:mondayOf(new Date()),person:'me',edit:null,month:new Date().toISOString().slice(0,7),bv:''};
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DAGEN=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const dl=d=>DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN[d.getMonth()];
function weekNr(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function subjOptions(sel){
  const w=SUBJECTS.filter(s=>s.active&&s.type==='werk'),v=SUBJECTS.filter(s=>s.active&&s.type==='verlof');
  const o=a=>a.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(s.name)}</option>`).join('');
  return `<option value="">Kies onderwerp</option><optgroup label="Werk">${o(w)}</optgroup>${v.length?`<optgroup label="Verlof">${o(v)}</optgroup>`:''}`;
}
async function openUren(){
  await Promise.all([loadSubjects(),loadUsers()]);
  await renderUren();
}
async function renderUren(){
  const el=$('tab-uren'),admin=ME.role==='admin';
  const from=iso(U.week),to=iso(addDays(U.week,6));
  const q=U.person==='me'?'':'&user='+U.person;
  const r=await api(`/hours?from=${from}&to=${to}${q}`);
  const hours=r.ok?r.j.hours:[];
  const showWho=U.person==='all';
  const days=[...Array(7)].map((_,i)=>addDays(U.week,i));
  const total=hours.reduce((a,h)=>a+h.hours,0);
  const e=U.edit?hours.find(h=>h.id===U.edit):null;
  const defDate=e?e.date:(iso(new Date())>=from&&iso(new Date())<=to?iso(new Date()):from);
  const who=admin?`<label class="f">Persoon<select id="u-person"><option value="me" ${U.person==='me'?'selected':''}>Alleen ik</option><option value="all" ${U.person==='all'?'selected':''}>Iedereen</option>${USERS.filter(x=>x.id!==ME.id&&x.active).map(x=>`<option value="${x.id}" ${String(x.id)===String(U.person)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:'';
  el.innerHTML=`<div class="stack">
   <div class="card stack">
    <div class="weekbar"><button class="btn2" id="u-prev">← Vorige</button><b>Week ${weekNr(U.week)}: ${U.week.getDate()} t/m ${addDays(U.week,6).getDate()} ${MAANDEN[addDays(U.week,6).getMonth()]} ${addDays(U.week,6).getFullYear()}</b><button class="btn2" id="u-next">Volgende →</button><button class="btn2" id="u-now">Deze week</button><span style="margin-left:auto;font-weight:600">Totaal ${nl(total)} uur</span>${who}</div>
    <form id="u-form" class="row-f">
      <label class="f">Datum<input type="date" id="u-date" value="${defDate}" required></label>
      <label class="f">Uren<input type="number" id="u-h" step="0.25" min="0.25" max="24" inputmode="decimal" style="width:90px" value="${e?e.hours:''}" required></label>
      <label class="f grow">Onderwerp<select id="u-s" required>${subjOptions(e?e.subject_id:'')}</select></label>
      <label class="f grow">Omschrijving (mag leeg)<input id="u-n" maxlength="300" value="${esc(e?e.note:'')}"></label>
      <button class="btn" type="submit">${e?'Opslaan':'Toevoegen'}</button>${e?'<button class="btn2" type="button" id="u-cancel">Annuleren</button>':''}
    </form>
    <div class="msg" id="u-msg"></div>
   </div>
   <div class="card">${days.map(d=>{const di=iso(d),hs=hours.filter(h=>h.date===di),t=hs.reduce((a,h)=>a+h.hours,0);
     return `<div class="day"><div class="day-h"><b>${dl(d)}</b><span>${t?nl(t)+' uur':''}</span></div>${hs.map(h=>`<div class="entry"><span class="e-s">${esc(h.subject)}${h.type==='verlof'?'<span class="tag">verlof</span>':''}${showWho?`<span class="tag">${esc(h.person)}</span>`:''}${h.note?`<span class="e-n">${esc(h.note)}</span>`:''}</span><span class="e-h">${nl(h.hours)}</span><button class="btn2" data-edit="${h.id}">Wijzig</button><button class="btn2 danger" data-del="${h.id}">Verwijder</button></div>`).join('')}</div>`}).join('')}</div>
   ${admin?'<div id="u-month"></div>':''}
  </div>`;
  $('u-prev').onclick=()=>{U.week=addDays(U.week,-7);U.edit=null;renderUren()};
  $('u-next').onclick=()=>{U.week=addDays(U.week,7);U.edit=null;renderUren()};
  $('u-now').onclick=()=>{U.week=mondayOf(new Date());U.edit=null;renderUren()};
  if($('u-person'))$('u-person').onchange=ev=>{U.person=ev.target.value;U.edit=null;renderUren()};
  if($('u-cancel'))$('u-cancel').onclick=()=>{U.edit=null;renderUren()};
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{U.edit=+b.dataset.edit;renderUren()});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Zeker weten?';setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent='Verwijder'}},4000);return}
    const r=await api('/hours/'+b.dataset.del,{method:'DELETE'});if(r.ok)renderUren();else flash($('u-msg'),r.j.error,true)});
  $('u-form').onsubmit=async ev=>{
    ev.preventDefault();const m=$('u-msg');
    const body={date:$('u-date').value,hours:parseFloat($('u-h').value),subject_id:+$('u-s').value,note:$('u-n').value};
    if(!body.subject_id){flash(m,'Kies een onderwerp.',true);return}
    let r;
    if(e)r=await api('/hours/'+e.id,{method:'PUT',body});
    else{if(admin&&U.person!=='me'&&U.person!=='all')body.user_id=+U.person;r=await api('/hours',{method:'POST',body})}
    if(!r.ok){flash(m,r.j.error||'Opslaan lukt niet.',true);return}
    U.edit=null;await renderUren();flash($('u-msg'),'Opgeslagen.');
  };
  if(admin)renderMonth();
}
async function renderMonth(){
  const el=$('u-month');if(!el)return;
  const r=await api('/report?month='+U.month);const d=r.ok?r.j:{bySubject:[],byPerson:[],byBv:[],invoice:[],unbilled:0};
  const bvOpts=['<option value="">Alle BV\'s</option>'].concat(BVS.map(b=>`<option value="${esc(b)}" ${U.bv===b?'selected':''}>${esc(b)}</option>`)).join('');
  const inv=d.invoice.filter(x=>!U.bv||x.bv===U.bv);
  el.innerHTML=`<div class="card stack">
    <div class="row-f"><h2 class="sec" style="margin:0">Overzicht per maand</h2><label class="f">Maand<input type="month" id="m-month" value="${U.month}"></label></div>
    <div class="charts" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
     <div><h3 style="margin:0 0 6px;font-size:13px;color:var(--ink2)">Doorbelast per BV</h3><table class="simple"><tbody>${d.byBv.map(x=>`<tr><td class="l">${esc(x.bv)}</td><td>${nl(x.hours)} uur</td></tr>`).join('')||'<tr><td class="l" style="color:var(--ink3)">Nog geen uren</td></tr>'}${d.unbilled?`<tr><td class="l" style="color:var(--ink3)">Intern, niet doorbelast</td><td style="color:var(--ink3)">${nl(d.unbilled)} uur</td></tr>`:''}</tbody></table></div>
     <div><h3 style="margin:0 0 6px;font-size:13px;color:var(--ink2)">Per onderwerp</h3><table class="simple"><tbody>${d.bySubject.map(x=>`<tr><td class="l">${esc(x.subject)}</td><td>${nl(x.hours)} uur</td></tr>`).join('')||'<tr><td class="l" style="color:var(--ink3)">Nog geen uren</td></tr>'}</tbody></table></div>
     <div><h3 style="margin:0 0 6px;font-size:13px;color:var(--ink2)">Per persoon</h3><table class="simple"><tbody>${d.byPerson.map(x=>`<tr><td class="l">${esc(x.person)}</td><td>${nl(x.hours)} uur${x.leave?` <span style="color:var(--ink3)">(waarvan ${nl(x.leave)} verlof)</span>`:''}</td></tr>`).join('')||'<tr><td class="l" style="color:var(--ink3)">Nog geen uren</td></tr>'}</tbody></table></div>
    </div>
    <div class="row-f"><h2 class="sec" style="margin:0">Factuuroverzicht</h2><label class="f">BV<select id="m-bv">${bvOpts}</select></label><button class="btn" id="m-dl" ${inv.length?'':'disabled'}>Download als bestand</button></div>
    <div class="scroll"><table class="simple"><thead><tr><th class="l">BV</th><th class="l">Onderwerp</th><th class="l">Persoon</th><th>Uren</th></tr></thead><tbody>${inv.map(x=>`<tr><td class="l">${esc(x.bv)}</td><td class="l">${esc(x.subject)}</td><td class="l">${esc(x.person)}</td><td>${nl(x.hours)}</td></tr>`).join('')||'<tr><td class="l" colspan="4" style="color:var(--ink3)">Geen doorbelaste uren in deze maand</td></tr>'}</tbody></table></div>
  </div>`;
  $('m-month').onchange=ev=>{if(ev.target.value){U.month=ev.target.value;renderMonth()}};
  $('m-bv').onchange=ev=>{U.bv=ev.target.value;renderMonth()};
  $('m-dl').onclick=async()=>{
    const t=ss.get('mt');
    const res=await fetch(API+`/invoice.csv?month=${U.month}${U.bv?'&bv='+encodeURIComponent(U.bv):''}`,{headers:{Authorization:'Bearer '+t}});
    if(!res.ok)return;const blob=await res.blob();const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`${U.month} Uren${U.bv?' - '+U.bv:''}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
}

// ---------- personeel ----------
function splitEditor(split){
  const box=document.createElement('div');box.className='splitbox';
  const cur=Object.fromEntries((split||[]).map(s=>[s.bv,s.pct]));
  box.innerHTML=BVS.map(b=>`<div class="sp"><input type="checkbox" data-bv="${esc(b)}" ${cur[b]?'checked':''} id="sp-${esc(b)}"><label for="sp-${esc(b)}" style="flex:1">${esc(b)}</label><input type="number" min="1" max="100" step="1" data-pct="${esc(b)}" value="${cur[b]||''}" ${cur[b]?'':'disabled'}>%</div>`).join('')+'<div class="sum"></div>';
  const upd=()=>{let s=0,n=0;box.querySelectorAll('[data-bv]').forEach(c=>{const p=box.querySelector(`[data-pct="${c.dataset.bv}"]`);p.disabled=!c.checked;if(c.checked){n++;s+=+p.value||0}});
    box.querySelector('.sum').textContent=n?`Samen ${s}%${s===100?'':' (moet 100% zijn)'}`:'Geen BV gekozen: intern, wordt niet doorbelast.'};
  box.addEventListener('input',upd);box.addEventListener('change',upd);upd();
  return {el:box,get:()=>[...box.querySelectorAll('[data-bv]')].filter(c=>c.checked).map(c=>({bv:c.dataset.bv,pct:+box.querySelector(`[data-pct="${c.dataset.bv}"]`).value||0}))};
}
const splitText=s=>s.length?s.map(x=>`${esc(x.bv)} ${x.pct}%`).join(', '):'<span style="color:var(--ink3)">Intern</span>';
let P={editS:null,resetU:null,addSplit:null};
async function openPers(){await Promise.all([loadSubjects(),loadUsers()]);renderPers()}
function renderPers(){
  const el=$('tab-pers');
  const uRows=USERS.map(u=>`<tr><td class="l"><b>${esc(u.name)}</b></td><td class="l">${esc(u.username)}</td><td class="l">${u.role==='admin'?'Beheerder':'Medewerker'}</td><td class="l"><span class="pill ${u.active?'':'off'}">${u.active?(u.mustChange?'Nog geen eigen wachtwoord':'Actief'):'Geblokkeerd'}</span></td><td>${u.id===ME.id?'':`<button class="btn2" data-act="${u.id}">${u.active?'Blokkeren':'Activeren'}</button> <button class="btn2" data-reset="${u.id}">Nieuw wachtwoord</button>`}${P.resetU===u.id?`<div class="row-f" style="margin-top:8px;justify-content:flex-end"><input id="ru-pw" type="text" placeholder="Tijdelijk wachtwoord" autocomplete="off"><button class="btn2" data-resetok="${u.id}">Opslaan</button></div>`:''}</td></tr>`).join('');
  const sRows=SUBJECTS.map(s=>P.editS===s.id?`<tr><td class="l" colspan="5"><div class="stack" id="es-box"><div class="row-f"><label class="f grow">Naam<input id="es-name" value="${esc(s.name)}"></label></div><div id="es-split"></div><div class="row-f"><button class="btn" id="es-save">Opslaan</button><button class="btn2" id="es-cancel">Annuleren</button><button class="btn2" id="es-act">${s.active?'Deactiveren':'Activeren'}</button><button class="btn2 danger" id="es-del">Verwijderen</button></div><div class="msg" id="es-msg"></div></div></td></tr>`
    :`<tr><td class="l"><b>${esc(s.name)}</b></td><td class="l">${s.type==='verlof'?'Verlof':'Werk'}</td><td class="l">${s.type==='verlof'?'<span style="color:var(--ink3)">Niet van toepassing</span>':splitText(s.split)}</td><td class="l"><span class="pill ${s.active?'':'off'}">${s.active?'Actief':'Niet meer in gebruik'}</span></td><td><button class="btn2" data-es="${s.id}">Wijzig</button></td></tr>`).join('');
  el.innerHTML=`<div class="stack">
   <div class="card stack"><h2 class="sec">Personeel</h2>
    <div class="scroll"><table class="simple"><thead><tr><th class="l">Naam</th><th class="l">Gebruikersnaam</th><th class="l">Rol</th><th class="l">Status</th><th></th></tr></thead><tbody>${uRows}</tbody></table></div>
    <form id="nu-form" class="row-f"><label class="f grow">Naam<input id="nu-name" required></label><label class="f grow">Gebruikersnaam<input id="nu-un" required autocapitalize="off"></label><label class="f">Rol<select id="nu-role"><option value="medewerker">Medewerker</option><option value="admin">Beheerder</option></select></label><label class="f grow">Tijdelijk wachtwoord<input id="nu-pw" required autocomplete="off" minlength="8"></label><button class="btn" type="submit">Personeelslid toevoegen</button></form>
    <div class="sub">Geef het tijdelijke wachtwoord zelf door aan de persoon. Bij de eerste keer inloggen kiest die een eigen wachtwoord.</div><div class="msg" id="nu-msg"></div>
   </div>
   <div class="card stack"><h2 class="sec">Onderwerpen</h2>
    <div class="scroll"><table class="simple"><thead><tr><th class="l">Onderwerp</th><th class="l">Soort</th><th class="l">Doorbelasten aan</th><th class="l">Status</th><th></th></tr></thead><tbody>${sRows}</tbody></table></div>
    <form id="ns-form" class="stack"><div class="row-f"><label class="f grow">Nieuw onderwerp<input id="ns-name" required></label><label class="f">Soort<select id="ns-type"><option value="werk">Werk</option><option value="verlof">Verlof</option></select></label></div><div id="ns-split"></div><div class="row-f"><button class="btn" type="submit">Onderwerp toevoegen</button></div></form><div class="msg" id="ns-msg"></div>
   </div></div>`;
  // nieuw onderwerp
  P.addSplit=splitEditor([]);$('ns-split').appendChild(P.addSplit.el);
  $('ns-type').onchange=ev=>{$('ns-split').style.display=ev.target.value==='verlof'?'none':''};
  $('ns-form').onsubmit=async ev=>{ev.preventDefault();const t=$('ns-type').value;
    const r=await api('/subjects',{method:'POST',body:{name:$('ns-name').value,type:t,split:t==='verlof'?[]:P.addSplit.get()}});
    if(!r.ok){flash($('ns-msg'),r.j.error,true);return}await loadSubjects();renderPers();flash($('ns-msg'),'Onderwerp toegevoegd.')};
  // onderwerp wijzigen
  el.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>{P.editS=+b.dataset.es;renderPers()});
  if(P.editS){const s=SUBJECTS.find(x=>x.id===P.editS);
    if(s&&$('es-split')){const ed=splitEditor(s.split);if(s.type==='werk')$('es-split').appendChild(ed.el);
      $('es-cancel').onclick=()=>{P.editS=null;renderPers()};
      $('es-save').onclick=async()=>{const body={name:$('es-name').value};if(s.type==='werk')body.split=ed.get();const r=await api('/subjects/'+s.id,{method:'PUT',body});if(!r.ok){flash($('es-msg'),r.j.error,true);return}P.editS=null;await loadSubjects();renderPers()};
      $('es-act').onclick=async()=>{await api('/subjects/'+s.id,{method:'PUT',body:{active:!s.active}});P.editS=null;await loadSubjects();renderPers()};
      $('es-del').onclick=async()=>{const r=await api('/subjects/'+s.id,{method:'DELETE'});if(!r.ok){flash($('es-msg'),r.j.error,true);return}P.editS=null;await loadSubjects();renderPers()};}}
  // personeel
  $('nu-form').onsubmit=async ev=>{ev.preventDefault();
    const r=await api('/users',{method:'POST',body:{name:$('nu-name').value,username:$('nu-un').value,role:$('nu-role').value,tempPassword:$('nu-pw').value}});
    if(!r.ok){flash($('nu-msg'),r.j.error,true);return}await loadUsers();renderPers();flash($('nu-msg'),'Personeelslid toegevoegd.')};
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const u=USERS.find(x=>x.id==b.dataset.act);await api('/users/'+u.id,{method:'PUT',body:{active:!u.active}});await loadUsers();renderPers()});
  el.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{P.resetU=+b.dataset.reset;renderPers()});
  el.querySelectorAll('[data-resetok]').forEach(b=>b.onclick=async()=>{const r=await api('/users/'+b.dataset.resetok,{method:'PUT',body:{resetPassword:$('ru-pw').value}});if(!r.ok){alert(r.j.error);return}P.resetU=null;await loadUsers();renderPers()});
}

// ---------- start ----------
(async()=>{ if(ss.get('mt')){ await startApp() } else view('login') })();
</script>
